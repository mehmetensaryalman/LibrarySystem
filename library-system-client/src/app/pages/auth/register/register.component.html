<div class="auth-page">

  <form
    class="auth-card"
    (ngSubmit)="register()"
  >

    <div class="auth-heading">

      <h1>
        Kütüphane Sistemi
      </h1>

      <h2>
        Kayıt Ol
      </h2>

    </div>

    <div class="form-field">

      <label for="email">
        E-posta
      </label>

      <input
        id="email"
        name="email"
        pInputText
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        placeholder="ornek@mail.com"
      />

    </div>

    <div class="form-field">

      <label for="password">
        Parola
      </label>

      <p-password
        inputId="password"
        name="password"
        [(ngModel)]="password"
        [feedback]="true"
        [toggleMask]="true"
        placeholder="Parolanız"
      ></p-password>

      <small class="password-hint">
        Parolanız en az 6 karakter olmalıdır.
      </small>

    </div>

    @if (errorMessage()) {

      <div class="error-message">
        {{ errorMessage() }}
      </div>

    }

    @if (successMessage()) {

      <div class="success-message">
        {{ successMessage() }}
      </div>

    }

    <p-button
      type="submit"
      label="Kayıt Ol"
      [loading]="loading()"
      [disabled]="loading()"
      styleClass="register-button"
    ></p-button>

    <div class="auth-switch-link">

      <span>
        Zaten hesabın var mı?
      </span>

      <a routerLink="/login">
        Giriş Yap
      </a>

    </div>

  </form>

</div>
