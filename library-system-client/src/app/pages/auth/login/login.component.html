<div class="auth-page">

  <form
    class="auth-card"
    (ngSubmit)="login()"
  >

    <div class="auth-heading">

      <h1>
        Kütüphane Sistemi
      </h1>

      <h2>
        Giriş Yap
      </h2>

    </div>

    <div class="form-field">

      <label for="email">
        E-posta
      </label>

      <input
        id="email"
        name="email"
        pInputText
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        placeholder="ornek@mail.com"
      />

    </div>

    <div class="form-field">

      <label for="password">
        Parola
      </label>

      <p-password
        inputId="password"
        name="password"
        [(ngModel)]="password"
        [feedback]="false"
        [toggleMask]="true"
        placeholder="Parolanız"
      ></p-password>

    </div>

    <div class="login-options">

      <label
        class="remember-me-option"
        for="rememberMe"
      >

        <input
          id="rememberMe"
          name="rememberMe"
          type="checkbox"
          [(ngModel)]="rememberMe"
        />

        <span>
          Beni hatırla
        </span>

      </label>

      <a
        class="forgot-password-link"
        routerLink="/forgot-password"
      >
        Şifremi Unuttum
      </a>

    </div>

    @if (errorMessage()) {

      <div class="error-message">
        {{ errorMessage() }}
      </div>

    }

    <p-button
      type="submit"
      label="Giriş Yap"
      [loading]="loading()"
      [disabled]="loading()"
      styleClass="login-button"
    ></p-button>

    <div class="auth-switch-link">

      <span>
        Hesabın yok mu?
      </span>

      <a routerLink="/register">
        Kayıt Ol
      </a>

    </div>

  </form>

</div>
